findings:
- id: layer-responsibilities
  summary: The design explicitly assigns durable, distinct responsibilities to semantics, mechanics, and
    lifecycle layers and defines their dependency direction.
  evidence:
  - repo:docs/SPEC.md
  - repo:src/invariant/semantics
  - repo:src/invariant/mechanics
  - repo:src/invariant/lifecycle
  proposed: domain
  disposition: adoptable
  authority: design:repo:docs/SPEC.md#layer-ownership
  records:
  - kind: domain
    value:
      id: semantics
      responsibility: Interprets requested outcomes, selects relevant semantic scope, authors accepted
        governance, and reviews candidate meaning without mutating Git.
      authority: design:repo:docs/SPEC.md#semantics
      parent: null
      architecture: []
      contracts: []
  - kind: domain
    value:
      id: mechanics
      responsibility: Owns deterministic repository facts, tracked-state validation, exact candidate construction,
        verification evidence, and guarded Git operations.
      authority: design:repo:docs/SPEC.md#mechanics
      parent: null
      architecture: []
      contracts: []
  - kind: domain
    value:
      id: lifecycle
      responsibility: Owns resumable task progression through isolated work, prospective-tree construction,
        verification, atomic landing, and archival completion.
      authority: design:repo:docs/SPEC.md#lifecycle
      parent: null
      architecture: []
      contracts: []
- id: exact-atomic-landing
  summary: Verification and landing are bound to exact Git object identity; landing uses compare-and-swap
    and must preserve the target on conflicts, stale evidence, failed checks, or concurrent movement.
  evidence:
  - repo:protocol/protocol.md
  - repo:src/invariant/mechanics/landing.py
  - repo:src/invariant/mechanics/git.py
  - repo:tests/test_lifecycle_guarantees.py
  proposed: constraint
  disposition: adoptable
  authority: design:repo:protocol/protocol.md#verification-and-landing
  records:
  - kind: constraint
    value:
      id: exact-atomic-landing
      assertion: Candidate review, verification evidence, and landing bind to an exact Git tree, and the
        integration ref moves atomically by compare-and-swap or remains unchanged.
      authority: design:repo:protocol/protocol.md#verification-and-landing
      applies_to:
      - mechanics
      - lifecycle
      surfaces:
      - repo:src/invariant/mechanics/landing.py
      - repo:src/invariant/mechanics/git.py
      material:
      - repo:protocol/protocol.md
      - repo:tests/test_lifecycle_guarantees.py
      verifies:
      - test:tests/test_lifecycle_guarantees.py
- id: git-capability-precondition
  summary: The implementation treats required Git capabilities as a precondition to lifecycle mutation,
    with executable witnesses for supported and missing capabilities.
  evidence:
  - repo:docs/SPEC.md
  - repo:src/invariant/mechanics/git.py
  - repo:tests/test_git_capabilities.py
  proposed: constraint
  disposition: adoptable
  authority: design:repo:docs/SPEC.md#mechanics
  records:
  - kind: constraint
    value:
      id: required-git-capabilities
      assertion: Required exact-candidate and linked-worktree Git capabilities must be proven available
        before lifecycle mutation.
      authority: design:repo:docs/SPEC.md#mechanics
      applies_to:
      - mechanics
      - lifecycle
      surfaces:
      - repo:src/invariant/mechanics/git.py
      material:
      - repo:docs/SPEC.md
      - repo:tests/test_git_capabilities.py
      verifies:
      - test:tests/test_git_capabilities.py
- id: remote-publication-boundary
  summary: Remote publication is independently governed, off by default, restricted to an existing upstream,
    and occurs only after retaining the verified local landing.
  evidence:
  - repo:docs/SPEC.md
  - repo:protocol/protocol.md
  - repo:src/invariant/mechanics/landing.py
  - repo:tests/test_remote_push.py
  proposed: constraint
  disposition: adoptable
  authority: design:repo:protocol/protocol.md#landing
  records:
  - kind: constraint
    value:
      id: bounded-remote-publication
      assertion: Remote publication requires explicit accepted policy, targets only the configured integration
        branch's existing upstream, pushes the exact landed commit, and cannot undo a successful local
        landing when publication fails.
      authority: design:repo:protocol/protocol.md#landing
      applies_to:
      - mechanics
      - lifecycle
      surfaces:
      - repo:src/invariant/mechanics/landing.py
      - repo:tests/test_remote_push.py
      material:
      - repo:protocol/protocol.md
      - repo:docs/SPEC.md
      verifies:
      - test:tests/test_remote_push.py
- id: structured-cli-boundary
  summary: The design defines a stable structured command boundary between hosts and the core CLI, but
    the inspected Git-mechanics-only test suite does not provide an executable witness for that cross-layer
    contract.
  evidence:
  - repo:docs/SPEC.md
  - repo:src/invariant/cli
  - repo:src/invariant/harness
  - repo:src/invariant/semantics/schemas.py
  proposed: contract
  disposition: needs-verifier
  authority: design:repo:docs/SPEC.md#application-boundary
- id: accepted-meaning-authority
  summary: Repository evidence, audits, discoveries, model output, and path matching do not independently
    become accepted governance; durable meaning requires attributable authority and candidate review.
  evidence:
  - repo:protocol/protocol.md
  - repo:docs/SPEC.md
  - repo:src/invariant/semantics/adoption.py
  - repo:src/invariant/semantics/review.py
  proposed: constraint
  disposition: needs-verifier
  authority: design:repo:protocol/protocol.md#establishment-authority
