version: 2
id: bounded-remote-publication
assertion: Remote publication requires explicit accepted policy, targets only the configured integration
  branch's existing upstream, pushes the exact landed commit, and cannot undo a successful local landing
  when publication fails.
authority: design:repo:protocol/protocol.md#publication
applies_to:
- domain:mechanics
- domain:lifecycle
- capability:remote.publish
surfaces:
- repo:src/invariant/mechanics/landing.py
- repo:tests/test_remote_push.py
material:
- architecture:protocol/protocol.md#publication
- repo:docs/SPEC.md
verifies:
- test:tests/test_remote_push.py
directives:
- id: require-publication-resolution
  kind: require-resolution
  capability: remote.publish
  resolver: user
