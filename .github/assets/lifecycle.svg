<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Invariant's managed change lifecycle</title>
  <desc id="desc">Durable memory constrains a fixed lifecycle: a goal becomes a receipt and an isolated worktree, the agent implements, an exact candidate tree is captured with evidence, affected decisions are reviewed within authority, and the change lands atomically and is archived. Several changes run this lifecycle in parallel in one clone; a moved integration head means a re-verification, never a clobbered landing.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#626262"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f7d1b"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ink { fill: #171717; }
      .muted { fill: #626262; }
      .accent { fill: #4f7d1b; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
      .title { font-size: 14px; font-weight: 650; }
      .body { font-size: 11.5px; }
      .small { font-size: 10.5px; }
      .line { fill: none; stroke: #626262; stroke-width: 1.5; marker-end: url(#arrow); }
      .line-accent { fill: none; stroke: #4f7d1b; stroke-width: 1.5; marker-end: url(#arrow-accent); }
      .loop { fill: none; stroke: #626262; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .plane { fill: #ffffff; stroke: #171717; stroke-width: 1.5; }
      .soft { fill: #eeeeec; stroke: #171717; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #b8b8b8; stroke-width: 1.2; }
      .gate { fill: #ffffff; stroke: #171717; stroke-width: 2; }
      .lane { fill: none; stroke: #b8b8b8; stroke-width: 1.2; }
    </style>

    <symbol id="goal" viewBox="0 0 48 48">
      <path d="M10 6h4v38h-4z" fill="#4f7d1b"/>
      <path d="M14 8h24l-6 8 6 8H14z" fill="#4f7d1b"/>
    </symbol>
    <symbol id="receipt" viewBox="0 0 48 48">
      <path d="M11 4h26v40l-4-3-4 3-4-3-5 3-5-3-4 3z" fill="#4f7d1b"/>
      <rect x="16" y="12" width="16" height="2.5" fill="#ffffff"/>
      <rect x="16" y="18" width="16" height="2.5" fill="#ffffff"/>
      <rect x="16" y="24" width="10" height="2.5" fill="#ffffff"/>
    </symbol>
    <symbol id="worktree" viewBox="0 0 48 48">
      <circle cx="12" cy="10" r="6" fill="#4f7d1b"/>
      <circle cx="12" cy="38" r="6" fill="#4f7d1b"/>
      <circle cx="36" cy="18" r="6" fill="#4f7d1b"/>
      <path d="M12 16v16" stroke="#4f7d1b" stroke-width="4"/>
      <path d="M36 24c0 8-8 8-20 10" fill="none" stroke="#4f7d1b" stroke-width="4"/>
    </symbol>
    <symbol id="tree" viewBox="0 0 48 48">
      <rect x="6" y="6" width="36" height="36" rx="4" fill="#4f7d1b"/>
      <path d="M14 14h20M14 22h14M14 30h20M14 38h8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="evidence" viewBox="0 0 48 48">
      <path d="M8 6h32v36H8z" fill="#4f7d1b"/>
      <path d="M14 26l6 6 14-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="review" viewBox="0 0 48 48">
      <circle cx="21" cy="21" r="13" fill="none" stroke="#4f7d1b" stroke-width="5"/>
      <path d="M30 30l12 12" stroke="#4f7d1b" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="land" viewBox="0 0 48 48">
      <path d="M24 4v24" stroke="#4f7d1b" stroke-width="5" stroke-linecap="round"/>
      <path d="M14 19l10 11 10-11" fill="none" stroke="#4f7d1b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 32v10h34V32h-6v5H13v-5z" fill="#4f7d1b"/>
    </symbol>
    <symbol id="archive" viewBox="0 0 48 48">
      <rect x="6" y="6" width="36" height="10" fill="#4f7d1b"/>
      <path d="M9 18h30v24H9z" fill="#4f7d1b"/>
      <rect x="19" y="24" width="10" height="3" fill="#ffffff"/>
    </symbol>
    <symbol id="human" viewBox="0 0 48 48">
      <circle cx="24" cy="14" r="9" fill="#4f7d1b"/>
      <path d="M6 44c0-11 8-17 18-17s18 6 18 17z" fill="#4f7d1b"/>
    </symbol>
    <symbol id="agent" viewBox="0 0 48 48">
      <rect x="22" y="6" width="4" height="9" fill="#4f7d1b"/>
      <circle cx="24" cy="5" r="3" fill="#4f7d1b"/>
      <rect x="6" y="15" width="36" height="28" rx="7" fill="#4f7d1b"/>
      <circle cx="17" cy="28" r="3.5" fill="#ffffff"/>
      <circle cx="31" cy="28" r="3.5" fill="#ffffff"/>
      <rect x="16" y="36" width="16" height="3" rx="1.5" fill="#ffffff"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <g class="sans">
    <!-- Durable memory -->
    <rect x="24" y="22" width="1152" height="84" class="soft"/>
    <text x="44" y="46" class="mono ink label">DURABLE MEMORY</text>
    <text x="44" y="64" class="muted body">Survives agents, sessions, models, and parallel work. Read at every checkpoint; written only by an attested landing.</text>
    <g transform="translate(44,74)">
      <rect width="360" height="22" class="gate"/>
      <text x="10" y="15" class="ink body"><tspan font-weight="650">Records</tspan><tspan class="muted">  domains · contracts · decisions · constraints</tspan></text>
      <rect x="372" width="360" height="22" class="card"/>
      <text x="382" y="15" class="ink body"><tspan font-weight="650">Evidence</tspan><tspan class="muted">  sources · audits · checks · reviews</tspan></text>
      <rect x="744" width="368" height="22" class="card"/>
      <text x="754" y="15" class="ink body"><tspan font-weight="650">Authority</tspan><tspan class="muted">  who may make, change, or waive a promise</tspan></text>
    </g>

    <path d="M600 106 V146" class="line"/>
    <text x="612" y="130" class="mono muted small">constrains every stage below</text>

    <!-- Lifecycle stages -->
    <text x="24" y="168" class="mono ink label">ONE MANAGED CHANGE</text>

    <g transform="translate(24,180)">
      <g>
        <rect width="150" height="118" class="card"/>
        <use href="#goal" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Goal</text>
        <text x="12" y="92" class="muted body">free-form request</text>
        <text x="12" y="106" class="muted body">from a person or agent</text>
      </g>
      <path d="M150 239 H166" class="line"/>
      <g transform="translate(167,0)">
        <rect width="150" height="118" class="card"/>
        <use href="#receipt" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Receipt</text>
        <text x="12" y="92" class="muted body">goal digest, base head,</text>
        <text x="12" y="106" class="muted body">selected records</text>
      </g>
      <path d="M317 239 H333" class="line"/>
      <g transform="translate(334,0)">
        <rect width="150" height="118" class="card"/>
        <use href="#worktree" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Isolate</text>
        <text x="12" y="92" class="muted body">linked worktree,</text>
        <text x="12" y="106" class="muted body">agent implements</text>
      </g>
      <path d="M484 239 H500" class="line"/>
      <g transform="translate(501,0)">
        <rect width="150" height="118" class="card"/>
        <use href="#tree" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Candidate</text>
        <text x="12" y="92" class="muted body">one exact Git tree,</text>
        <text x="12" y="106" class="muted body">reach computed</text>
      </g>
      <path d="M651 239 H667" class="line"/>
      <g transform="translate(668,0)">
        <rect width="150" height="118" class="card"/>
        <use href="#evidence" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Evidence</text>
        <text x="12" y="92" class="muted body">contract witnesses</text>
        <text x="12" y="106" class="muted body">and checks, recorded</text>
      </g>
      <path d="M818 239 H834" class="line"/>
      <g transform="translate(835,0)">
        <rect width="150" height="118" class="gate"/>
        <use href="#review" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Review</text>
        <text x="12" y="92" class="muted body">affected decisions</text>
        <text x="12" y="106" class="muted body">acknowledged in authority</text>
      </g>
      <path d="M985 239 H1001" class="line"/>
      <g transform="translate(1002,0)">
        <rect width="150" height="118" class="gate"/>
        <use href="#land" x="12" y="10" width="40" height="40"/>
        <text x="12" y="74" class="ink title">Land</text>
        <text x="12" y="92" class="muted body">compare-and-swap,</text>
        <text x="12" y="106" class="muted body">attested, then archived</text>
      </g>
    </g>

    <!-- Who acts where -->
    <use href="#agent" x="44" y="308" width="32" height="32"/>
    <text x="84" y="329" class="muted body">agent owns investigation and implementation</text>
    <use href="#human" x="880" y="308" width="32" height="32"/>
    <text x="920" y="329" class="muted body">human decides when authority is lacking</text>

    <!-- Repair loop: evidence back to the isolated worktree -->
    <path d="M743 298 C 743 352, 480 352, 434 300" class="loop"/>
    <text x="590" y="366" text-anchor="middle" class="mono muted small">defect or failed check → repair in the same worktree</text>

    <!-- Parallel changes -->
    <rect x="24" y="386" width="1152" height="150" class="plane"/>
    <text x="44" y="410" class="mono ink label">MANY CHANGES, ONE CLONE</text>
    <text x="44" y="428" class="muted body">Each change owns its worktree, receipt, and evidence. Landings serialize on the integration branch; nothing else is shared.</text>

    <g transform="translate(44,444)">
      <rect width="340" height="18" class="lane"/>
      <text x="8" y="13" class="mono muted small">change A</text>
      <path d="M100 9 H320" class="line-accent"/>
      <rect y="28" width="340" height="18" class="lane"/>
      <text x="8" y="41" class="mono muted small">change B</text>
      <path d="M100 37 H320" class="line-accent"/>
      <rect y="56" width="340" height="18" class="lane"/>
      <text x="8" y="69" class="mono muted small">change C</text>
      <path d="M100 65 H320" class="line-accent"/>
    </g>

    <g transform="translate(408,440)">
      <rect width="176" height="86" class="gate"/>
      <text x="88" y="24" text-anchor="middle" class="ink title">Integration branch</text>
      <text x="88" y="44" text-anchor="middle" class="muted body">one landing at a time</text>
      <text x="88" y="60" text-anchor="middle" class="muted body">atomic ref update</text>
      <text x="88" y="76" text-anchor="middle" class="muted body">attestation chain kept</text>
    </g>

    <path d="M584 466 C 620 466, 620 514, 584 512" class="loop"/>
    <text x="632" y="478" class="mono muted small">head moved? re-verify against it, never clobber</text>
    <text x="632" y="496" class="mono muted small">a real conflict blocks; the integration branch never moves for it</text>
  </g>
</svg>
