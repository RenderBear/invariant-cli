<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Invariant separates authority from execution inside a Git-grounded governance layer</title>
  <desc id="desc">Supplied intent and narrow resolution capabilities enter an authority lane. Harness execution requests enter a separate execution lane. Invariant combines a semantic kernel with a Git-grounded lifecycle and emits only scoped capability decisions, exact candidates, attestations, and atomic Git consequences.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#626262"/>
    </marker>
    <marker id="accent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4f7d1b"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ink{fill:#171717}.muted{fill:#626262}.accent{fill:#4f7d1b}.hero{font-size:22px;font-weight:650}.label{font-size:11px;font-weight:700;letter-spacing:1.2px}.heading{font-size:16px;font-weight:650}.body{font-size:12px}.small{font-size:11px}.plane{fill:#fff;stroke:#171717;stroke-width:1.5}.kernel{fill:#eeeeec;stroke:#171717;stroke-width:2.5}.card{fill:#fff;stroke:#b8b8b8;stroke-width:1.2}.rule{stroke:#b8b8b8;stroke-width:1}.arrow{fill:none;stroke:#626262;stroke-width:1.5;marker-end:url(#arrow)}.accent-arrow{fill:none;stroke:#4f7d1b;stroke-width:1.8;marker-end:url(#accent-arrow)}.request{fill:none;stroke:#626262;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <g class="sans">
    <text x="24" y="34" class="ink hero">governance layer = semantic kernel + Git-grounded lifecycle</text>
    <text x="24" y="57" class="muted body">Authority determines meaning. Execution causes effects. Invariant never treats one as the other.</text>

    <rect x="24" y="88" width="286" height="300" class="plane"/>
    <text x="44" y="116" class="mono ink label">AUTHORITY</text>
    <text x="44" y="137" class="muted body">Attributable and causally bounded</text>
    <rect x="44" y="158" width="246" height="82" class="card"/>
    <text x="60" y="184" class="ink heading">Intent supply</text>
    <text x="60" y="205" class="muted body">user: or accepted policy states</text>
    <text x="60" y="221" class="muted body">the desired repository outcome</text>
    <rect x="44" y="254" width="246" height="102" class="card"/>
    <text x="60" y="280" class="ink heading">Resolution capability</text>
    <text x="60" y="301" class="mono accent small">intent.resolve</text>
    <text x="60" y="321" class="muted body">one actor · one typed action</text>
    <text x="60" y="337" class="muted body">no shell, write, ref, or network access</text>
    <text x="167" y="375" text-anchor="middle" class="mono muted small">DECIDES WHAT MAY BE MEANT</text>

    <rect x="354" y="76" width="492" height="324" class="kernel"/>
    <rect x="354" y="76" width="8" height="324" fill="#4f7d1b"/>
    <text x="384" y="108" class="mono ink label">INVARIANT GOVERNANCE PROTOCOL</text>
    <rect x="384" y="128" width="432" height="104" class="card"/>
    <text x="404" y="157" class="ink heading">Semantic kernel</text>
    <text x="404" y="179" class="muted body">select accepted repository meaning</text>
    <text x="404" y="197" class="muted body">compile open prose into closed consequences</text>
    <text x="600" y="219" text-anchor="middle" class="mono accent small">OPEN SEMANTICS → CLOSED CONSEQUENCES</text>
    <text x="600" y="254" text-anchor="middle" class="ink heading">+</text>
    <rect x="384" y="272" width="432" height="102" class="card"/>
    <text x="404" y="301" class="ink heading">Git-grounded lifecycle</text>
    <text x="404" y="323" class="muted body">durable ledgers · isolated work refs · exact candidate</text>
    <text x="404" y="341" class="muted body">evidence · single-use grants · compare-and-swap landing</text>
    <text x="600" y="362" text-anchor="middle" class="mono muted small">SURVIVES WORKERS, PROCESSES, AND TRANSCRIPTS</text>

    <rect x="890" y="88" width="286" height="300" class="plane"/>
    <text x="910" y="116" class="mono ink label">EXECUTION</text>
    <text x="910" y="137" class="muted body">One operational consequence per grant</text>
    <rect x="910" y="158" width="246" height="198" class="card"/>
    <text x="930" y="184" class="mono accent small">worktree.create</text>
    <text x="930" y="207" class="mono accent small">worktree.write</text>
    <text x="930" y="230" class="mono accent small">verification.run</text>
    <text x="930" y="253" class="mono accent small">candidate.converge</text>
    <text x="930" y="276" class="mono accent small">integration.land</text>
    <text x="930" y="299" class="mono accent small">remote.publish</text>
    <text x="930" y="322" class="mono accent small">change.invalidate</text>
    <text x="930" y="345" class="mono accent small">work.discard</text>
    <text x="1033" y="375" text-anchor="middle" class="mono muted small">CAUSES EXACT, SCOPED EFFECTS</text>

    <path d="M310 196H346" class="accent-arrow"/>
    <text x="328" y="185" text-anchor="middle" class="mono muted small">intent</text>
    <path d="M310 302H346" class="accent-arrow"/>
    <text x="328" y="291" text-anchor="middle" class="mono muted small">answer</text>
    <path d="M846 236H882" class="accent-arrow"/>
    <text x="864" y="225" text-anchor="middle" class="mono muted small">grant</text>

    <rect x="24" y="434" width="1152" height="94" class="card"/>
    <text x="44" y="463" class="mono ink label">HARNESS</text>
    <text x="44" y="486" class="ink heading">Owns models, tools, worker dispatch, retries, and throughput.</text>
    <text x="44" y="508" class="muted body">It requests execution and may receive one delegated resolution capability. It never gains standing authority from being able to run.</text>
    <path d="M790 484H882" class="request"/>
    <text x="836" y="473" text-anchor="middle" class="mono muted small">request</text>
    <path d="M600 434V406" class="request"/>
    <text x="612" y="422" class="mono muted small">drive</text>
  </g>
</svg>
