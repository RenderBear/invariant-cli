<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Invariant governance layer</title>
  <desc id="desc">A user supplies intent. Agents execute under scoped capabilities. Between them the governance layer holds the semantic kernel of accepted records and the Git mechanics that bind every consequence to exact state. Resolution is a separate plane: a bound question is signed off by the user directly or by a secondary agent holding one scoped capability, grounded in supplied sources or human-presented evaluation skills. The lower band expands the Git-grounded lifecycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5f6368"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4f7d1b"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ink{fill:#171717}.muted{fill:#666}.green{fill:#4f7d1b}
      .eyebrow{font-size:11px;font-weight:750;letter-spacing:1.25px}
      .hero{font-size:25px;font-weight:680}.title{font-size:18px;font-weight:680}
      .body{font-size:13px}.small{font-size:11px}
      .card{fill:#fff;stroke:#aeb1b4;stroke-width:1.3}
      .kernel{fill:#f1f2ef;stroke:#171717;stroke-width:2}
      .row{fill:#fff;stroke:#c9cbcc;stroke-width:1.2}
      .lane{fill:#fafafa;stroke:#aeb1b4;stroke-width:1.3}
      .plane{fill:#fff;stroke:#171717;stroke-width:1.6;stroke-dasharray:6 4}
      .node{fill:#fff;stroke:#171717;stroke-width:1.2}
      .node-green{fill:#f4f8ef;stroke:#4f7d1b;stroke-width:1.5}
      .ground-box{fill:#fafafa;stroke:#aeb1b4;stroke-width:1.2}
      .pill{fill:#fff;stroke:#aeb1b4;stroke-width:1.2}
      .icon{fill:none;stroke:#171717;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill{fill:#171717}
      .arrow{fill:none;stroke:#5f6368;stroke-width:1.5;marker-end:url(#arrow)}
      .green-arrow{fill:none;stroke:#4f7d1b;stroke-width:1.8;marker-end:url(#green-arrow)}
      .return{fill:none;stroke:#4f7d1b;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#green-arrow)}
      .ground{fill:none;stroke:#9a9da0;stroke-width:1.2;stroke-dasharray:3 4}
    </style>
  </defs>

  <rect width="1200" height="790" fill="#fff"/>
  <g class="sans">
    <text x="24" y="36" class="ink hero">governance layer = semantic kernel + Git mechanics</text>
    <text x="24" y="60" class="muted body">Intent stays with the user. Execution stays with agents. Signing off is its own plane. Everything between is decided, verified, and recorded.</text>

    <!-- user -->
    <rect x="24" y="96" width="204" height="236" rx="4" class="card"/>
    <circle cx="126" cy="140" r="15" class="icon"/>
    <path d="M96 190a30 30 0 0 1 60 0" class="icon"/>
    <text x="126" y="222" text-anchor="middle" class="mono green eyebrow">USER</text>
    <text x="126" y="248" text-anchor="middle" class="ink title">Intent</text>
    <text x="126" y="272" text-anchor="middle" class="muted body">Says what should change.</text>
    <text x="126" y="292" text-anchor="middle" class="muted body">Supplies the sources that</text>
    <text x="126" y="310" text-anchor="middle" class="muted body">meaning is judged against.</text>

    <!-- governance layer -->
    <rect x="284" y="84" width="632" height="260" rx="4" class="kernel"/>
    <rect x="284" y="84" width="7" height="260" fill="#4f7d1b"/>
    <text x="314" y="114" class="mono ink eyebrow">GOVERNANCE LAYER</text>
    <text x="892" y="114" text-anchor="end" class="mono green small">OPEN SEMANTICS → CLOSED CONSEQUENCES</text>

    <rect x="314" y="130" width="578" height="94" rx="4" class="row"/>
    <text x="330" y="153" class="mono ink eyebrow">SEMANTIC KERNEL</text>
    <text x="876" y="153" text-anchor="end" class="muted small">accepted repository meaning</text>
    <rect x="330" y="170" width="112" height="36" rx="18" class="pill"/>
    <rect x="452" y="170" width="112" height="36" rx="18" class="pill"/>
    <rect x="574" y="170" width="150" height="36" rx="18" class="pill"/>
    <rect x="734" y="170" width="142" height="36" rx="18" class="pill"/>
    <text x="386" y="193" text-anchor="middle" class="ink body">domains</text>
    <text x="508" y="193" text-anchor="middle" class="ink body">contracts</text>
    <text x="649" y="193" text-anchor="middle" class="ink body">ADRs · semantics</text>
    <text x="805" y="193" text-anchor="middle" class="ink body">constraints</text>

    <rect x="314" y="236" width="578" height="94" rx="4" class="row"/>
    <text x="330" y="259" class="mono ink eyebrow">GIT MECHANICS</text>
    <text x="876" y="259" text-anchor="end" class="muted small">every consequence bound to exact state</text>
    <rect x="330" y="276" width="126" height="36" rx="18" class="pill"/>
    <rect x="466" y="276" width="140" height="36" rx="18" class="pill"/>
    <rect x="616" y="276" width="126" height="36" rx="18" class="pill"/>
    <rect x="752" y="276" width="124" height="36" rx="18" class="pill"/>
    <text x="393" y="299" text-anchor="middle" class="ink body">change ledger</text>
    <text x="536" y="299" text-anchor="middle" class="ink body">isolated worktrees</text>
    <text x="679" y="299" text-anchor="middle" class="ink body">exact candidate</text>
    <text x="814" y="299" text-anchor="middle" class="ink body">attested landing</text>

    <!-- agents -->
    <rect x="972" y="96" width="204" height="236" rx="4" class="card"/>
    <rect x="1052" y="126" width="44" height="34" rx="7" class="icon"/>
    <circle cx="1066" cy="143" r="3" class="icon-fill"/>
    <circle cx="1082" cy="143" r="3" class="icon-fill"/>
    <path d="M1074 126V114" class="icon"/>
    <circle cx="1074" cy="110" r="3.5" class="icon-fill"/>
    <path d="M1044 190a30 30 0 0 1 60 0" class="icon"/>
    <text x="1074" y="222" text-anchor="middle" class="mono green eyebrow">AGENTS</text>
    <text x="1074" y="248" text-anchor="middle" class="ink title">Execution</text>
    <text x="1074" y="272" text-anchor="middle" class="muted body">Plan and implement under</text>
    <text x="1074" y="292" text-anchor="middle" class="muted body">scoped capabilities.</text>
    <text x="1074" y="310" text-anchor="middle" class="muted body">Never authority.</text>

    <!-- flows, top row -->
    <path d="M228 150H276" class="green-arrow"/>
    <text x="252" y="139" text-anchor="middle" class="mono muted small">intent</text>
    <path d="M228 300H276" class="arrow"/>
    <text x="252" y="289" text-anchor="middle" class="mono muted small">sources</text>
    <path d="M916 150H964" class="green-arrow"/>
    <text x="940" y="139" text-anchor="middle" class="mono muted small">grants</text>
    <path d="M972 300C950 300 944 316 916 316" class="return"/>
    <text x="944" y="332" text-anchor="middle" class="mono muted small">work · evidence</text>

    <!-- resolution plane -->
    <rect x="24" y="378" width="1152" height="150" rx="4" class="plane"/>
    <text x="44" y="408" class="mono ink eyebrow">RESOLUTION · SIGNING OFF</text>
    <text x="1156" y="408" text-anchor="end" class="mono green eyebrow">A PLANE OF ITS OWN, APART FROM INTENT AND EXECUTION</text>
    <text x="44" y="432" class="muted body">One bound question at a time, over the exact candidate. Who answers is policy; what they judge against is supplied, never invented.</text>

    <rect x="44" y="450" width="180" height="60" rx="4" class="node"/>
    <circle cx="70" cy="474" r="7" class="icon"/>
    <path d="M56 496a14 14 0 0 1 28 0" class="icon"/>
    <text x="150" y="474" text-anchor="middle" class="ink body">User</text>
    <text x="150" y="493" text-anchor="middle" class="muted small">direct authority</text>
    <text x="244" y="486" text-anchor="middle" class="muted body">or</text>
    <rect x="264" y="450" width="220" height="60" rx="4" class="node-green"/>
    <rect x="280" y="466" width="22" height="17" rx="4" class="icon"/>
    <circle cx="287" cy="474" r="1.6" class="icon-fill"/>
    <circle cx="295" cy="474" r="1.6" class="icon-fill"/>
    <path d="M291 466V461" class="icon"/>
    <text x="392" y="474" text-anchor="middle" class="ink body">Secondary agent</text>
    <text x="392" y="493" text-anchor="middle" class="mono green small">one scoped intent.resolve</text>

    <text x="560" y="486" text-anchor="middle" class="mono muted small">judged against</text>
    <rect x="628" y="450" width="256" height="60" rx="4" class="ground-box"/>
    <text x="756" y="474" text-anchor="middle" class="ink body">sources</text>
    <text x="756" y="493" text-anchor="middle" class="muted small">user-supplied and third-party material</text>
    <rect x="904" y="450" width="256" height="60" rx="4" class="ground-box"/>
    <text x="1032" y="474" text-anchor="middle" class="ink body">skills</text>
    <text x="1032" y="493" text-anchor="middle" class="muted small">human-presented evaluation</text>

    <!-- governance <-> resolution -->
    <path d="M560 344V372" class="arrow"/>
    <text x="548" y="362" text-anchor="end" class="mono muted small">questions</text>
    <path d="M640 372V352" class="return"/>
    <text x="652" y="362" class="mono muted small">answers, consumed</text>

    <!-- lifecycle -->
    <rect x="24" y="560" width="1152" height="214" rx="4" class="lane"/>
    <text x="44" y="592" class="mono ink eyebrow">GIT-GROUNDED LIFECYCLE</text>
    <text x="1156" y="592" text-anchor="end" class="mono green eyebrow">THE GIT MECHANICS ROW, EXPANDED</text>

    <rect x="52" y="634" width="126" height="60" rx="4" class="node"/>
    <text x="115" y="659" text-anchor="middle" class="ink body">recommend</text>
    <text x="115" y="679" text-anchor="middle" class="mono muted small">change ledger</text>

    <rect x="244" y="612" width="112" height="40" rx="4" class="node-green"/>
    <rect x="244" y="662" width="112" height="40" rx="4" class="node-green"/>
    <rect x="244" y="712" width="112" height="40" rx="4" class="node-green"/>
    <text x="300" y="637" text-anchor="middle" class="ink body">unit A</text>
    <text x="300" y="687" text-anchor="middle" class="ink body">unit B</text>
    <text x="300" y="737" text-anchor="middle" class="ink body">unit C</text>

    <rect x="438" y="650" width="150" height="66" rx="4" class="node"/>
    <text x="513" y="677" text-anchor="middle" class="ink body">exact candidate</text>
    <text x="513" y="698" text-anchor="middle" class="mono muted small">candidate ref</text>

    <rect x="660" y="650" width="150" height="66" rx="4" class="node"/>
    <text x="735" y="677" text-anchor="middle" class="ink body">evidence</text>
    <text x="735" y="698" text-anchor="middle" class="muted small">verifiers · review · sign-off</text>

    <rect x="882" y="650" width="150" height="66" rx="4" class="node-green"/>
    <text x="957" y="677" text-anchor="middle" class="ink body">atomic landing</text>
    <text x="957" y="698" text-anchor="middle" class="mono green small">compare-and-swap</text>

    <path d="M178 664H222L244 634" class="green-arrow"/>
    <path d="M178 664H234L244 682" class="green-arrow"/>
    <path d="M178 664H214L244 730" class="green-arrow"/>
    <path d="M356 632L422 670L438 676" class="green-arrow"/>
    <path d="M356 682H430" class="green-arrow"/>
    <path d="M356 732L422 700L438 692" class="green-arrow"/>
    <path d="M588 683H652" class="arrow"/>
    <path d="M810 683H874" class="arrow"/>

    <path d="M115 694V748H226" class="ground"/>
    <text x="52" y="765" class="mono muted small">refs/invariant/changes/*</text>
    <text x="382" y="765" class="mono muted small">attempt refs retain every branch</text>
    <path d="M1032 683H1105V625" class="ground"/>
    <text x="1156" y="629" text-anchor="end" class="mono muted small">accepted branch ref</text>
  </g>
</svg>
